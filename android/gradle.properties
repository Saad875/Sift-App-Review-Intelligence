org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Backend URL baked into BuildConfig. localhost works on a phone or emulator after
# `adb reverse tcp:8000 tcp:8000`. Alternatives: http://10.0.2.2:8000/ (emulator, no adb reverse),
# http://<PC LAN IP>:8000/ (phone on the same Wi-Fi), or a hosted https URL.
# Override per build with -Psift.backendUrl=https://your-server/
sift.backendUrl=http://localhost:8000/
